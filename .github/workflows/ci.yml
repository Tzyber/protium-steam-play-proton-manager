name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# nur PR-läufe werden abgebrochen. der release-guard braucht das ergebnis jedes
# main-commits; deshalb hat jeder push eine eigene gruppe, sonst würde github
# einen wartenden main-lauf beim nächsten push verwerfen.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run bench:gate
      - run: npm run vite:build
      - run: npm audit --omit=dev

  # mutation läuft bei jedem push auf main (das gate bleibt voll). in PRs nur,
  # wenn die mutierten bereiche oder die testinfrastruktur betroffen sind:
  # dependabot-, doku- und rust-PRs sparen so die vollen ~47 min. der filter
  # läuft über den diff zur PR-basis, nicht über paths-ignore des workflows,
  # damit check/rust/audit weiter bei jedem PR laufen.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mutation: ${{ steps.diff.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          if ! changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD"); then
            echo "diff zur PR-basis fehlgeschlagen; mutation laeuft sicherheitshalber" >&2
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq '^(src/core/|tests/|stryker\.config\.mjs|scripts/run-mutation\.mjs|vitest\.config\.ts|vitest\.shared\.ts|src/ui/consequences\.ts|src/ui/formatError\.ts|src/ui/sizeSummary\.ts|src/ui/stores/confirmStore\.ts|src/ui/stores/cleanupHelpers\.ts)'; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.mutation == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable=v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      # nur main schreibt caches; PR-läufe lesen sie mit. jede PR schrieb sonst
      # rund 1 GB, womit das repo-limit (10 GB) schnell voll lief.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri braucht webkit2gtk schon zum kompilieren (pkg-config im build-script)
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable=v1
        with:
          toolchain: stable
      # nur main schreibt caches; PR-läufe lesen sie mit. jede PR schrieb sonst
      # rund 1 GB, womit das repo-limit (10 GB) schnell voll lief.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      # cargo-audit hat keine --config-flag; die config wird an
      # .cargo/audit.toml (repo-root, cwd) oder ~/.cargo/audit.toml gesucht 
      # deshalb liegt audit.toml in .cargo/, nicht neben der Cargo.lock.
      # vulnerabilities sind fatal, warnings nicht, neue advisories schlagen an.
      - run: cargo audit --file src-tauri/Cargo.lock
