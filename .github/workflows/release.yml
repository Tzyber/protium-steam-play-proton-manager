name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04

    steps:
      # M4.5: action-tags auf commit-SHAs gepinnt (2026-07-31), mutable
      # tags sind supply-chain-risiko, SHAs sind immutabel.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version
        run: |
          node scripts/check-release-version.mjs --self-test
          node scripts/check-release-version.mjs

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable=v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            squashfs-tools \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify before release build
        run: |
          npm run check
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # appimagetool 1.9.1 gepinnt (identisch zu continuous, gleiche
      # build-id 3431b179) → sha-verifizierbar, M4.5-konform. continuous
      # gelangte teils als leerer/abgebrochener download auf den runner
      # (wget-exit 4 = network failure) → retries + größen- und
      # sha-check. `--appimage-extract` braucht kein /dev/fuse
      # (container-verifiziert, non-root), repack braucht `file` (in
      # Linux dependencies installiert).
      - name: Install appimagetool
        run: |
          wget -q --timeout=30 --tries=5 --retry-connrefused --wait=2 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          [ -s /tmp/appimagetool ] || { echo "FEHLER: appimagetool-download leer/fehlgeschlagen"; exit 1; }
          printf 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool\n' | sha256sum -c -
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract
          mv squashfs-root /tmp/appimagetool-extracted
          ln -s /tmp/appimagetool-extracted/AppRun /usr/local/bin/appimagetool

      # NO_STRIP: linuxdeploy bündelt einen alten binutils-strip (build
      # 2024-07-26), der .relr.dyn-sektionen moderner system-libs nicht
      # kennt → "unknown type [0x13] section .relr.dyn" lässt den
      # AppImage-bundling-Schritt abbrechen (reproduziert lokal, fix
      # verifiziert). system-libs sind bereits gestrippt, strip-überspringen
      # ist sicher.
      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage deb
        env:
          NO_STRIP: "true"

      - name: Patch AppImage with Wayland/EGL fix
        run: |
          APPIMAGE=$(echo src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage)
          echo "Patching: ${APPIMAGE}"

          [ -f "${APPIMAGE}" ] || { echo "FEHLER: AppImage nicht gefunden: ${APPIMAGE}"; exit 1; }

          "${APPIMAGE}" --appimage-extract
          mkdir -p squashfs-root/apprun-hooks
          cp src-tauri/appimage-hooks/01-wayland-fix.sh squashfs-root/apprun-hooks/
          chmod +x squashfs-root/apprun-hooks/01-wayland-fix.sh

          # linuxdeploys AppRun sourced NUR linuxdeploy-plugin-gtk.sh,
          # iteriert nicht über apprun-hooks/*. unseren hook hinterhersourcen.
          sed -i '/source.*linuxdeploy-plugin-gtk\.sh/a source "$this_dir"/apprun-hooks/"01-wayland-fix.sh"' squashfs-root/AppRun

          ARCH=x86_64 appimagetool squashfs-root "${APPIMAGE}"

          echo "Gepatchtes AppImage: ${APPIMAGE}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Protium ${{ github.ref_name }}"
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
