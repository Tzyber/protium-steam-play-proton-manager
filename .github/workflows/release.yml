name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      # M4.5: action-tags auf commit-SHAs gepinnt (2026-07-31), mutable
      # tags sind supply-chain-risiko, SHAs sind immutabel.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable=v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            squashfs-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify before release build
        run: |
          npm run check
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # appimagetool aus dem continuous-kanal: upstream bietet KEIN
      # versioniertes AppImage-asset (verifiziert 2026-07-31), sha-pinning
      # des artefacts ist damit unmöglich. bekanntes residuum, dokumentiert
      # in PROTIUM_STATUS (security-härtung 2026-07-31, M4.5).
      - name: Install appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract
          mv squashfs-root /tmp/appimagetool-extracted
          ln -s /tmp/appimagetool-extracted/AppRun /usr/local/bin/appimagetool

      # NO_STRIP: linuxdeploy bündelt einen alten binutils-strip (build
      # 2024-07-26), der .relr.dyn-sektionen moderner system-libs nicht
      # kennt → "unknown type [0x13] section .relr.dyn" lässt den
      # AppImage-bundling-Schritt abbrechen (reproduziert lokal, fix
      # verifiziert). system-libs sind bereits gestrippt, strip-überspringen
      # ist sicher.
      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage deb
        env:
          NO_STRIP: "true"

      - name: Patch AppImage with Wayland/EGL fix
        run: |
          APPIMAGE=$(echo src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage)
          echo "Patching: ${APPIMAGE}"

          [ -f "${APPIMAGE}" ] || { echo "FEHLER: AppImage nicht gefunden: ${APPIMAGE}"; exit 1; }

          "${APPIMAGE}" --appimage-extract
          mkdir -p squashfs-root/apprun-hooks
          cp src-tauri/appimage-hooks/01-wayland-fix.sh squashfs-root/apprun-hooks/
          chmod +x squashfs-root/apprun-hooks/01-wayland-fix.sh

          # linuxdeploys AppRun sourced NUR linuxdeploy-plugin-gtk.sh,
          # iteriert nicht über apprun-hooks/*. unseren hook hinterhersourcen.
          sed -i '/source.*linuxdeploy-plugin-gtk\.sh/a source "$this_dir"/apprun-hooks/"01-wayland-fix.sh"' squashfs-root/AppRun

          ARCH=x86_64 appimagetool squashfs-root "${APPIMAGE}"

          echo "Gepatchtes AppImage: ${APPIMAGE}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Protium ${{ github.ref_name }}"
          body: |
            ## 0.2.9, sha512-abruf über das backend + navigation-whitelist

            **sicherheit:**
            - S-09: die prüfsumme wird jetzt über einen rust-command geladen
              (gleiche redirect-policy wie der download, 64-KiB-cap,
              retry + user-agent). vorher folgte tauri-plugin-http
              redirects ohne scope-recheck, nur die initiale url war
              gepinnt. github.com-http-scope dadurch ungenutzt → entfernt
              (INV-7). +2 cargo-tests.
            - S-08: navigation-whitelist in der webview. nur noch die app
              selbst (bzw. der dev-server) darf navigieren, unbekannte
              schemes wie file:/data:/mailto: landen im system-browser
              statt in der webview.

            **fix:**
            - fokus-klau im spiele-drawer: `restoreFocus(null)` griff nach
              dem mount über die fallback-kette den sidebar-nav-button an.
              restore springt nur noch zurück, wenn beim öffnen ein
              element gespeichert wurde.

            **proton-manager:**
            - download-rate (bytes/s, EMA-geglättet) in der progress-zeile
            - „✓ prüfsumme ok" beim entpacken, wenn das hash-asset
              verifiziert wurde
            - die warnung „ohne Verifikation installiert" ist jetzt
              wegklickbar (×)

            **verifikation:** vitest 271/271 · cargo 110/110 · check
            clean.
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
