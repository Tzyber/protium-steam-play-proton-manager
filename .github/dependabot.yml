# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Vue / TypeScript frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # vitest 5 bricht das mutationsgate: der stryker-vitest-runner joint
      # suite-namen mit " " statt " > " (stryker-mutator/stryker-js#6210).
      # wieder aufnehmen, sobald der fix (PR #6214) released ist.
      - dependency-name: "vitest"
        versions: ["5.x"]

  # Rust / Tauri backend dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["actions/*"]
